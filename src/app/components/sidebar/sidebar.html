<div class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon"><i class="ti ti-chart-bar"></i></div>
    <div>
      <div class="sb-logo-name">ReportHub</div>
      <div class="sb-logo-sub">Bank Reporting Platform</div>
    </div>
  </div>

  <div class="sb-nav">
    <div class="sb-section">Main</div>
    <div class="sb-item" [class.active]="activeScreen === 'dashboard'" (click)="setScreen('dashboard')">
      <i class="ti ti-layout-dashboard"></i> Dashboard
    </div>
    <div class="sb-item" [class.active]="activeScreen === 'reports' && activeFilter === 'All'" (click)="setScreen('reports')">
      <i class="ti ti-file-description"></i> All Reports
      <span class="sb-badge">303</span>
    </div>
    <div class="sb-item" [class.active]="activeScreen === 'runner'" (click)="setScreen('runner')">
      <i class="ti ti-player-play"></i> Run Report
    </div>
    <div class="sb-item" [class.active]="activeScreen === 'schedule'" (click)="setScreen('schedule')">
      <i class="ti ti-clock"></i> Schedules
    </div>

    <div class="sb-section" style="margin-top:8px">Countries</div>
    <div class="sb-item" [class.active]="activeScreen === 'reports' && activeFilter === 'Kenya'" (click)="setScreenWithFilter('reports', 'Kenya')">
      <i class="ti ti-map-pin"></i> Kenya <span class="sb-badge">179</span>
    </div>
    <div class="sb-item" [class.active]="activeScreen === 'reports' && activeFilter === 'Uganda'" (click)="setScreenWithFilter('reports', 'Uganda')">
      <i class="ti ti-map-pin"></i> Uganda <span class="sb-badge">95</span>
    </div>
    <div class="sb-item" [class.active]="activeScreen === 'reports' && activeFilter === 'Mozambique'" (click)="setScreenWithFilter('reports', 'Mozambique')">
      <i class="ti ti-map-pin"></i> Mozambique <span class="sb-badge">8</span>
    </div>
    <div class="sb-item" [class.active]="activeScreen === 'reports' && activeFilter === 'NBC'" (click)="setScreenWithFilter('reports', 'NBC')">
      <i class="ti ti-map-pin"></i> NBC <span class="sb-badge">21</span>
    </div>

    <div class="sb-section" style="margin-top:8px">Admin</div>
    <div class="sb-item"><i class="ti ti-users"></i> User Management</div>
    <div class="sb-item"><i class="ti ti-settings"></i> Settings</div>
  </div>

  <div class="sb-footer">
    <div class="sb-user">
      <div class="sb-avatar">JM</div>
      <div>
        <div class="sb-uname">James Mwangi</div>
        <div class="sb-urole">Report Admin · Kenya</div>
      </div>
    </div>
  </div>
</div>
