<div class="sched-hd">
  <div class="sched-hd-sub">{{ activeCount }} active schedules across all countries</div>
  <button class="tb-btn tb-btn-primary" style="font-size:12px" (click)="openModal()">
    <i class="ti ti-plus"></i> New schedule
  </button>
</div>

<div class="sched-list">
  <div class="sched-card" *ngFor="let sched of filteredSchedules">
    <div class="sched-icon"><i class="ti" [ngClass]="sched.icon"></i></div>
    <div class="sched-info">
      <div class="sched-name">{{ sched.name }}</div>
      <div class="sched-meta">{{ sched.meta }}</div>
    </div>
    <span class="sched-status"
      [ngClass]="{'ss-active': sched.active, 'ss-paused': !sched.active}">
      {{ sched.active ? 'Active' : 'Paused' }}
    </span>
    <button class="sched-toggle"
      [ngClass]="{'toggle-on': sched.active, 'toggle-off': !sched.active}"
      (click)="toggleSchedule(sched)" aria-label="Toggle">
      <div class="toggle-thumb"></div>
    </button>
  </div>

  <div class="new-sched" (click)="openModal()">
    <i class="ti ti-plus"></i> Add new schedule
  </div>
</div>

<!-- Modal rendered only when showModal is true -->
<app-schedule-modal
  *ngIf="showModal"
  (closed)="showModal = false"
  (saved)="onScheduleSaved($event)"
></app-schedule-modal>
