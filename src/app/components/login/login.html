<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>ReportHub Login</h1>
      <p>Sign in to access dashboards and reports</p>
    </div>
    <form (submit)="submitLogin(username.value, role.value, location.value); $event.preventDefault()">
      <label for="username">Username</label>
      <input id="username" #username type="text" placeholder="Enter your name" />

      <label for="role">Role</label>
      <input id="role" #role type="text" placeholder="Report Admin" />

      <label for="location">Location</label>
      <input id="location" #location type="text" placeholder="Kenya" />

      <button type="submit">Login</button>
    </form>
  </div>
</div>
